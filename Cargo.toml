[package]
name = "officer"
version = "1.2.7"
edition = "2021"

[dependencies]
actix-web = "4.9.0"
dotenv = "0.15.0"
kube = { version = "0.98.0", features = ["client", "runtime", "socks5", "ws"] }
serde = "1.0.209"
serde_json = "1.0.127"
k8s-openapi = { version = "0.24.0", features = ["latest"] }
paperclip = { version = "0.8", features = ["actix4", "v3", "swagger-ui"] }
chrono = "0.4.38"
log = "0.4.22"
futures = "0.3.30"
url = "2.5.2"
oauth2 = "4.4.2"
actix-session = { version = "0.10.1", features = ["cookie-session"] }
jsonwebtoken = "9.3.0"
reqwest = { version = "0.12.12", features = ["blocking", "json", "rustls-tls"] }
once_cell = "1.20.3"
openssl = { version = "0.10.71", features = ["vendored"] }
tokio = "1.44.0"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
base64 = "0.22.1"

